function call(method,...args) {
  if (!RPC_ALLOWED.has(method)) return Promise.reject(new Error('허용되지 않은 요청입니다.'));
  return new Promise((resolve,reject) => {
    const id = ++rpcSequence;
    const start = () => {
      const timer = setTimeout(() => {
        pendingRPC.delete(id);
        reject(new Error('GAS 서버 응답 시간이 초과되었습니다.'));
      }, 30000);
      pendingRPC.set(id,{resolve,reject,timer});
      bridgePort.postMessage({visionBridge:'v2',nonce:BRIDGE_NONCE,kind:'call',id,method,args});
    };
    if (bridgePort) start(); else {
      const timer = setTimeout(() => {
        const idx = bridgeWaiters.indexOf(ready);
        if (idx !== -1) bridgeWaiters.splice(idx,1);
        reject(new Error('GAS 연결에 실패했습니다. 브라우저의 외부 iframe 제한 또는 GAS 배포 설정을 확인해 주세요.'));
      },20000);
      const ready = () => {clearTimeout(timer);start();};
      bridgeWaiters.push(ready);
    }
  });
}

 return `<div data-position="${isFirst?'first':'second'}" class="tour-player ${win?'win':''} ${lose?'lose':''} ${bye?'bye':''}"><span>${E(name)}</span><span class="score">${E(score||'')}</span></div>`};
 return `<div class="tour-page"><div class="tour-head"><div><h1 class="tour-title">🏆 ${E(val('title'))} · 32강 대진표</h1><div class="tour-sub">단판 토너먼트 · 개인 핸디 · 참가 확정 선수 자동 배치</div></div><div class="tour-toolbar"><button class="tour-btn" onclick="nav('home')">⌂ HOME</button>${token?`<button class="tour-btn light" onclick="sampleRoster()">👥 참가자 불러오기</button><button class="tour-btn primary" onclick="askBracket('draw')">🎲 ${db.matches.length?'다시 배정':'추첨 배정'}</button><button class="tour-btn danger" onclick="askBracket('reset')">↺ 초기화</button><button class="tour-btn sim" onclick="startSimulation()">▶ 시뮬레이션</button>${simulation?`<button class="tour-btn" onclick="advanceSimulation()">다음 경기</button><button class="tour-btn" onclick="autoSimulation()" ${simTimer?'disabled':''}>전체 자동 진행</button><button class="tour-btn" onclick="toggleSimPause()">일시 정지</button><button class="tour-btn warning" onclick="stopSimulation()">시뮬레이션 종료</button>`:''}`:''}</div></div>
 <div class="tour-status"><span>경기 진행 <strong style="color:#a5b4fc">${completed} / 31</strong> · 참가 확정 <strong>${db.approvedCount}명</strong> · 부전승 <strong>${Math.max(0,32-db.approvedCount)}명</strong></span><span>${champion?'👑 우승 '+E(champion):'우승자 미정'}</span></div>
 ${simulation?`<div class="tour-preview"><span class="tour-sim-label">🧪 시뮬레이션 모드</span>　가상 경기 ${simulation.step}회 진행 · 실제 Matches 데이터는 변경되지 않습니다.</div>`:''}
 ${previewRoster&&!simulation?`<div class="tour-preview"><strong>불러온 선수 명단 (${previewRoster.length}명)</strong><p>현재는 미리보기입니다. 추첨 배정 버튼을 눌러야 실제 대진표에 반영됩니다.</p><div class="tour-roster">${previewRoster.map(p=>`<span>${E(p.name)} (${E(p.handicap)})</span>`).join('')}${Array.from({length:Math.max(0,32-previewRoster.length)},(_,i)=>`<span class="bye">부전승 ${i+1}</span>`).join('')}</div></div>`:''}
 ${arr.length?`<div class="tour-legend"><span><i class="tour-dot done"></i>경기 완료</span><span><i class="tour-dot live"></i>진행 중</span><span><i class="tour-dot pending"></i>경기 전·진출 대기</span><span><i class="tour-dot bye"></i>부전승 자동 진출</span></div><div class="tour-track"><div class="tour-grid" id="tourGrid"><svg id="tourSvg" class="tour-connectors" aria-hidden="true"></svg>${rounds.map(r=>`<div class="tour-round"><div class="tour-round-title">${['32강','16강','8강','4강','결승'][r-1]}</div><div class="tour-matches">${arr.filter(m=>+m.round===r).map(m=>`<div id="tour-match-${r}-${m.slot}" class="tour-match state-${matchVisualState(m).type}"><div class="tour-match-label" style="display:flex;gap:8px;align-items:center">${r}라운드 · ${+m.slot+1}경기 <span class="tour-match-state">${matchVisualState(m).label}</span></div>${slotView(m.player1,m,true)}${slotView(m.player2,m,false)}${token&&!simulation&&m.player1&&m.player2&&!String(m.player1).startsWith('BYE_')&&!String(m.player2).startsWith('BYE_')?`<button onclick="matchEditor('${E(m.id)}')">✏️ 승자 / 점수 등록</button>`:''}</div>`).join('')}</div></div>`).join('')}<div class="tour-round" style="justify-content:center"><div class="tour-round-title">CHAMPION</div><div id="tour-champion" class="tour-champ">🏆<br>${E(champion||'우승자 대기')}</div></div></div></div>`:`<div class="tour-empty">대진표가 아직 생성되지 않았습니다.${token?' 위의 참가자 불러오기 버튼으로 대진표를 생성하세요.':' 관리자가 참가 확정 후 공개할 예정입니다.'}</div>`}
 <div class="tour-note">※ 부전승은 별도 경기 없이 자동 진출합니다. 대진표 수정 및 경기 결과 입력은 관리자만 가능합니다.</div></div>`
}
function adminPage(){if(!token)return `<section class="section panel" style="max-width:460px;margin-left:auto;margin-right:auto"><h2>🔐 관리자 로그인</h2><form id="loginForm"><div class="field"><label for="pass">관리자 비밀번호</label><input id="pass" type="password" autocomplete="current-password" required></div><button type="submit" class="btn">로그인</button></form></section>`;return `<section class="section"><h2>⚙ 대회 관리자</h2><div class="grid">${infoCard('전체 신청',db.appliedCount+'명','mint',[])}${infoCard('참가 확정',db.approvedCount+'명','peach',[])}${infoCard('경기 수',db.matches.length+'경기','lav',[])}${infoCard('접수 상태',val('registrationOpen')==='TRUE'?'접수 중':'마감','pink',['registrationOpen'])}</div><div class="panel" style="margin-top:20px"><div class="toolbar"><button class="btn" onclick="openSettings()">✏️ 전체 대회 정보 수정</button><button class="btn secondary" onclick="playerEditor()">+ 선수 등록</button><button class="btn secondary" onclick="noticeEditor()">+ 공지 등록</button><button class="btn secondary" onclick="askBracket('draw')">🎲 대진표 추첨</button>${admin?.role==='admin'?'<button class="btn secondary" onclick="passwordEditor()">🔒 비밀번호 변경</button>':''}</div><p class="muted">다른 메뉴에서 선수 승인, 경기 기록 및 영역별 연필 수정을 진행할 수 있습니다.</p></div>${adminPlayers()}${adminNoticeList()}</section>`}
function adminPlayers(){if(!token)return '';return `<section class="section panel"><h3>관리자 · 신청자 관리 (${admin?.players?.length||0}명)</h3>${(admin?.players||[]).map(p=>`<div class="rowitem"><div><strong>${E(p.name)}</strong> <span class="chip">${E(p.status)}</span><small>핸디 ${E(p.handicap)} · ${E(p.phone)} · ${E(p.club)}</small></div><div class="player-actions"><button class="btn sm secondary" onclick="messageEditor('${E(p.id)}')">✉ 문자</button><button class="btn sm secondary" onclick="playerEditor('${E(p.id)}')">✏️ 편집</button></div></div>`).join('')||'<p>아직 신청자가 없습니다.</p>'}</section>`}
function adminNoticeList(){if(!token)return '';return `<section class="section panel"><h3>관리자 · 공지 관리</h3>${(admin?.notices||[]).map(n=>`<div class="rowitem"><span>${E(n.title)} <small>${n.visible==='TRUE'?'공개':'비공개'}</small></span><button class="btn sm secondary" onclick="noticeEditor('${E(n.id)}')">✏️ 편집</button></div>`).join('')||'<p>등록된 공지가 없습니다.</p>'}</section>`}
function render(){if(!db)return;document.body.classList.toggle('tournament-mode',page==='bracket');document.body.classList.toggle('admin-on',!!token);$('adminbar').classList.toggle('hide',!token);$('app').innerHTML=({home,guide,apply:application,players,bracket,results:()=>bracket(true),admin:adminPage}[page]||home)();$('footerText').textContent=val('appName')+' · '+val('organizer');$('brandTitle').textContent=val('appName')||'비전 당구 클럽 동호인 대회';document.title=val('appName');if(page==='bracket')requestAnimationFrame(()=>requestAnimationFrame(drawTourConnectors));}
async function refresh(){try{db=await call('getPublic');if(token)admin=await call('getAdmin',token);render()}catch(e){$('app').innerHTML=`<div class="empty">정보를 불러오지 못했습니다. ${E(e.message)}<br><button class="btn" onclick="refresh()">다시 시도</button></div>`}}
function modal(title,content,onSubmit){closeModal();$('modalRoot').innerHTML=`<div class="modalback" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">${E(title)}</h2><button class="x" id="modalClose" aria-label="닫기">✕</button></div><form id="modalForm">${content}<div class="toolbar" style="justify-content:flex-end;margin-top:20px"><button type="button" class="btn secondary" id="cancelModal">닫기</button><button type="submit" class="btn">저장하기</button></div></form></div></div>`;$('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});$('modalClose').onclick=closeModal;$('cancelModal').onclick=closeModal;$('modalForm').onsubmit=async e=>{e.preventDefault();try{await onSubmit(new FormData(e.target));closeModal();await refresh();toast('저장했습니다.')}catch(e){}};modalCloser=e=>{if(e.key==='Escape')closeModal()};document.addEventListener('keydown',modalCloser);$('modalClose').focus()}
function closeModal(){if(modalCloser)document.removeEventListener('keydown',modalCloser);modalCloser=null;$('modalRoot').innerHTML=''}
const FIELDS={appName:['홈페이지명','text'],title:['대회명','text'],subTitle:['대회 부제','text'],heroBadge:['상단 영문 문구','text'],intro:['대회 소개','textarea'],date:['대회 날짜','date'],time:['시작 시간','time'],organizer:['주최','text'],venue:['대회 장소','text'],address:['주소','text'],phone:['전화번호','text'],prizeTotal:['총상금 표시','text'],prizeDetail:['시상 내역','textarea'],entryFee:['참가비','text'],capacity:['모집 정원(미정은 빈칸)','number'],deadline:['접수 마감일(미정은 빈칸)','date'],registrationOpen:['참가 접수','toggle'],rules:['경기 규정','textarea'],eligibility:['참가 자격','textarea'],posterUrl:['포스터 이미지 URL','url'],noticeBanner:['상단 알림 문구','text']};
function openSettings(keys){if(!token)return;const names=keys?.length?keys:Object.keys(FIELDS);modal('✏️ 대회 정보 수정',names.map(k=>{const [label,type]=FIELDS[k];return `<div class="field"><label for="f_${k}">${E(label)}</label>${type==='textarea'?`<textarea id="f_${k}" name="${k}">${E(val(k))}</textarea>`:type==='toggle'?`<select id="f_${k}" name="${k}"><option value="TRUE" ${val(k)==='TRUE'?'selected':''}>접수 중</option><option value="FALSE" ${val(k)==='FALSE'?'selected':''}>마감</option></select>`:`<input id="f_${k}" name="${k}" type="${type}" value="${E(val(k))}">`}</div>`}).join(''),async fd=>await run('saveSettings',token,Object.fromEntries(fd.entries())))}
function playerEditor(id){const p=admin?.players?.find(x=>x.id===id)||{};modal(id?'✏️ 선수 수정':'➕ 선수 등록',`<div class="formgrid"><div class="field"><label>선수 이름 *</label><input name="name" value="${E(p.name||'')}" required></div><div class="field"><label>연락처</label><input name="phone" inputmode="numeric" maxlength="13" value="${E(p.phone||'')}"></div><div class="field"><label>개인 핸디 *</label><input type="number" min="1" max="50" name="handicap" value="${E(p.handicap||'')}" required></div><div class="field"><label>소속 클럽</label><input name="club" value="${E(p.club||'')}"></div><div class="field"><label>신청 상태</label><select name="status">${['대기','승인','취소'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>${id?'<p class="muted">삭제가 필요하면 아래 버튼을 이용해 주세요.</p><button type="button" class="btn sm danger" id="deleteEntry">선수 삭제</button>':''}`,async fd=>await run('upsertPlayer',token,{...Object.fromEntries(fd.entries()),id:id||''}));if(id)$('deleteEntry').onclick=()=>confirmDelete('정말 선수를 삭제하시겠습니까?',()=>run('removePlayer',token,id))}
function noticeEditor(id){const n=admin?.notices?.find(x=>x.id===id)||{};modal(id?'✏️ 공지 수정':'➕ 공지 등록',`<div class="field"><label>공지 제목</label><input name="title" required value="${E(n.title||'')}"></div><div class="field"><label>내용</label><textarea name="body">${E(n.body||'')}</textarea></div><div class="field"><label>노출 여부</label><select name="visible"><option value="TRUE" ${n.visible!=='FALSE'?'selected':''}>공개</option><option value="FALSE" ${n.visible==='FALSE'?'selected':''}>비공개</option></select></div>${id?'<button type="button" id="deleteEntry" class="btn sm danger">공지 삭제</button>':''}`,async fd=>await run('upsertNotice',token,{...Object.fromEntries(fd.entries()),id:id||''}));if(id)$('deleteEntry').onclick=()=>confirmDelete('정말 공지를 삭제하시겠습니까?',()=>run('removeNotice',token,id))}
function confirmDelete(question,action){modal('삭제 확인',`<p>${E(question)}</p>`,async()=>{await action()})}
function matchEditor(id){
 const m=db.matches.find(x=>x.id===id);
 if(!m)return;
 const playerOne=E(displayName(m.player1));
 const playerTwo=E(displayName(m.player2));
 const options=[m.player1,m.player2].filter(Boolean).map(pid=>`<option value="${E(pid)}" ${m.winner===pid?'selected':''}>${E(displayName(pid))}</option>`).join('');
 modal('✏️ 경기 결과 기록',`<p class="muted">${playerOne} vs ${playerTwo}</p><div class="formgrid"><div class="field"><label for="matchScore1">${playerOne} 점수</label><input id="matchScore1" name="score1" type="number" min="0" value="${E(m.score1)}"></div><div class="field"><label for="matchScore2">${playerTwo} 점수</label><input id="matchScore2" name="score2" type="number" min="0" value="${E(m.score2)}"></div></div><div class="field"><label for="matchWinner">승자</label><select id="matchWinner" name="winner" required><option value="">선택해 주세요</option>${options}</select></div>`,async fd=>await run('saveMatch',token,id,fd.get('score1'),fd.get('score2'),fd.get('winner')));
}
function createBracket(){return askBracket('draw')}
function passwordEditor(){modal('관리자 비밀번호 변경',`<div class="field"><label>새 비밀번호 (8자 이상)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>`,async fd=>await run('changePassword',token,fd.get('password')))}
async function signout(){try{await call('logout',token)}catch(e){}token='';admin=null;nav('home');toast('로그아웃했습니다.')}
document.addEventListener('input',e=>{if(e.target.id==='pphone'||(e.target.name==='phone'&&e.target.closest('#modalForm'))){const el=e.target;const pos=el.selectionStart;el.value=phoneFormat(el.value);if(pos===el.value.length-1)el.setSelectionRange(el.value.length,el.value.length)}});
document.addEventListener('submit',async e=>{if(e.target.id==='loginForm'){e.preventDefault();try{const result=await run('login',$('pass').value);token=result.token;admin=await call('getAdmin',token);await refresh();toast('관리자 로그인 성공')}catch(e){} }else if(e.target.id==='applyForm'){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());try{const result=await run('register',data);e.target.reset();await refresh();toast(result.message)}catch(e){}}});
refresh();
</script></div></body></html>
