/* 32강 독립 대진표 화면: Lucian에서 영감을 받은 어두운 스포츠 UI */
body.tournament-mode{background:#0a0d14;color:#f3f4f6}
body.tournament-mode .cap89-app>header,body.tournament-mode .cap89-app>.adminbar,body.tournament-mode .cap89-app>footer{display:none!important}
body.tournament-mode #app{width:100%;max-width:none;padding:0;margin:0}
.tour-page{min-height:100vh;padding:20px clamp(12px,3vw,38px);background:radial-gradient(ellipse at 85% 8%,#252b54,#0a0d14 45%);color:#f3f4f6}
.tour-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tour-title{font-weight:800;font-size:clamp(21px,2.5vw,30px);color:#f0efff;margin:0}
.tour-sub{font-size:12px;color:#9ca3af;margin-top:4px}

.tour-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tour-status{border:1px solid #354057;background:#161e30e8;border-radius:17px;padding:13px 18px;margin-bottom:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#c1c9df}
.tour-track{width:100%;overflow-x:auto;border:1px solid #293348;border-radius:20px;background:#0b111e;padding:22px 18px}
.tour-grid{display:flex;gap:46px;min-width:max-content;align-items:stretch}
.tour-round{width:232px;display:flex;flex-direction:column;flex-shrink:0}
.tour-round-title{padding:11px;text-align:center;background:#262b45;border:1px solid #3d4462;border-radius:12px;color:#c5cbff;font-weight:800;margin-bottom:12px}
.tour-matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px}
.tour-match{background:#161e30;border:1px solid #343d54;border-radius:15px;padding:6px;box-shadow:0 8px 28px #0004;position:relative}
.tour-match:after{content:' ';position:absolute;top:50%;left:100%;height:1px;width:23px;background:#57637a}
.tour-match-label{font-size:10px;color:#929fba;padding:3px 7px}
.tour-player{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid transparent;border-radius:9px;min-height:36px;padding:7px 8px;font-size:13px;font-weight:700}
.tour-player+.tour-player{border-top:1px solid #30384b}
.tour-player.win{color:#67e9ae;background:#163d34;border-color:#2a7c63}
.tour-player.lose{opacity:.35;filter:grayscale(1)}
.tour-player.bye{color:#8894a8;font-style:italic}
.tour-player .score{color:#c1c9da;font-size:12px}
.tour-match button{width:100%;margin-top:5px;padding:7px;font-size:12px;border:1px solid #444f72;border-radius:8px;background:#242f53;color:white;cursor:pointer}
.tour-champ{background:#3b321e;border:1px solid #b58c43;border-radius:18px;padding:20px;color:#ffdc88;text-align:center;box-shadow:0 0 20px #94742933}
.tour-empty{padding:26px;text-align:center;color:#aab4cf}
.tour-note{margin-top:12px;color:#9ca3af;font-size:12px}
@media(max-width:700px){.tour-page{padding:12px}.tour-round{width:205px}.tour-grid{gap:28px}}
.hero:has(.hero-poster-link){display:grid;grid-template-columns:minmax(0,1.15fr) minmax(200px,.72fr);gap:22px;align-items:center}
.hero-poster-link{position:relative;z-index:2;display:block;max-width:290px;justify-self:center;transition:transform .25s}
.hero-poster-link:hover{transform:translateY(-5px) rotate(-1deg)}
.hero-poster-link img{display:block;width:100%;max-height:380px;object-fit:contain;border-radius:20px;box-shadow:0 12px 38px #304b3c44}
@media(max-width:720px){.hero:has(.hero-poster-link){grid-template-columns:1fr}.hero-poster-link{width:70%;max-width:270px}.hero-poster-link img{max-height:330px}}
@media(prefers-reduced-motion:reduce){.hero-poster-link{transition:none}}

.tour-roster{display:flex;flex-wrap:wrap;gap:7px;padding:10px 0}.tour-roster span{background:#232f49;border:1px solid #455475;border-radius:10px;padding:7px 10px;font-size:12px;color:#d9e4fa}.tour-roster .bye{opacity:.58}.tour-sim-label{color:#ffe19d;font-weight:800;border:1px solid #a48a4a;padding:7px 12px;border-radius:12px}.tour-btn.warning{background:#554124;border-color:#86663a}.tour-btn.danger{background:#5c2634;border-color:#a34b60}.tour-btn.sim{background:#195c51;border-color:#2f9584}.tour-btn.light{background:#2a354e}.tour-preview{border:1px dashed #5a6a88;background:#141e33;padding:15px;border-radius:15px;margin-bottom:16px;color:#e9eefb}

/* v3.4 Lucian-inspired tournament neon connectors and state hierarchy */
.tour-grid{position:relative;isolation:isolate}
.tour-round{position:relative;z-index:2}
.tour-connectors{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;overflow:visible;pointer-events:none}
.tour-match:after{display:none}
.tour-match{transition:border-color .22s,box-shadow .22s,background .22s}
.tour-match.state-upcoming{background:#141b2a;border-color:#36415a}
.tour-match.state-upcoming .tour-match-label{color:#94a1ba}
.tour-match.state-ready{background:#1c263b;border-color:#526489}
.tour-match.state-progress{border-color:#e1ab58;background:#282337;box-shadow:0 0 0 1px #e1ab5840,0 0 16px #e1ab5829}
.tour-match.state-complete{border-color:#28bb88;background:#142d2b;box-shadow:0 0 0 1px #14a97940,0 0 18px #00dd9955}
.tour-match.state-bye{border-color:#557d9c;background:#172538}
.tour-match.state-complete .tour-player.win{color:#91ffd2;border-color:#33d99b;background:#126044;box-shadow:inset 0 0 10px #03e3a525,0 0 9px #03e3a52c}
.tour-match.state-complete .tour-player.lose{opacity:.33}
.tour-match-state{font-size:10px;font-weight:800;letter-spacing:.025em;margin-left:auto}
.state-complete .tour-match-state{color:#6bf2b7}.state-ready .tour-match-state{color:#abc5ff}.state-upcoming .tour-match-state{color:#91a0b9}.state-progress .tour-match-state{color:#ffd28b}.state-bye .tour-match-state{color:#94cbff}
.tour-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 14px;color:#d2dcf0;font-size:12px}
.tour-legend span{display:inline-flex;align-items:center;gap:7px}.tour-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tour-dot.done{background:#27db9f;box-shadow:0 0 10px #27db9f}.tour-dot.pending{background:#8390a7}.tour-dot.live{background:#f7b65b}.tour-dot.bye{background:#7cb8eb}
.tour-line-done{filter:drop-shadow(0 0 5px #00e7a7) drop-shadow(0 0 2px #00e7a7)}
.tour-line-bye{stroke-dasharray:5 5}
@media(prefers-reduced-motion:reduce){.tour-match{transition:none}.tour-line-done{filter:none}}

/* CAP89 step feedback: stage transitions depend on server responses, not fake progress */
.task-stage{position:fixed;top:94px;left:50%;transform:translateX(-50%);z-index:110;max-width:min(92vw,420px);width:max-content;background:#f9fffa;border:1px solid #bfd9c8;border-radius:16px;padding:13px 20px;box-shadow:0 16px 46px #314b3540;color:#355e49;font-weight:800;display:flex;align-items:center;gap:9px}
.task-stage::before{content:"";width:9px;height:9px;background:#5a9873;border-radius:50%;box-shadow:0 0 0 5px #dcefe2;animation:stage-pulse 1.5s ease-in-out infinite}
@keyframes stage-pulse{50%{opacity:.35}}
.confirm-note{padding:15px 17px;background:#f4f7f4;border:1px solid #dfebe1;border-radius:14px;color:#536859;font-size:14px}
.confirm-context{font-size:16px;font-weight:750;color:#385746;margin:0 0 12px}
@media(prefers-reduced-motion:reduce){.task-stage::before{animation:none}}
/* CAP89 soft-fill loading feedback: indeterminate, not a fake percentage */
.btn.loading,.tour-btn.loading{position:relative;overflow:hidden;cursor:wait;opacity:1!important;pointer-events:none;isolation:isolate}
.btn.loading::before,.tour-btn.loading::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(95,213,172,.45);transform:translateX(-100%);animation:cap89-fill 2.3s ease-in-out infinite}
@keyframes cap89-fill{0%{transform:translateX(-100%)}65%{transform:translateX(0)}100%{transform:translateX(100%)}}
.btn.loading,.tour-btn.loading{color:inherit}
@media(prefers-reduced-motion:reduce){.btn.loading::before,.tour-btn.loading::before{animation:none;transform:none;background:rgba(95,213,172,.22)}}

/* CAP89 bank payment information: no account number is hard-coded */
.payment-info{margin:18px 0;background:#f1f8f3;border:1px solid #dcebdd;border-radius:17px;padding:18px;position:relative}.payment-fee{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#527b65;font-weight:700}.payment-fee strong{font-size:23px;color:#273f35}.payment-inner{border-top:1px solid #d8e7dc;margin-top:13px;padding-top:15px}.payment-inner>strong,.payment-notice>strong{color:#527b65}.payment-inner dl{display:grid;grid-template-columns:87px 1fr;gap:10px;margin:15px 0 0}.payment-inner dt{color:#687c70;font-size:13px}.payment-inner dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:650}.account-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.payment-notice{border-top:1px solid #d8e7dc;margin-top:15px;padding-top:13px}.payment-notice p{margin:8px 0 0;font-size:13px;color:#536b5c;white-space:pre-line}.admin-on .payment-info .pencil{right:10px;top:10px}.admin-on .payment-info{padding-top:38px}@media(max-width:650px){.payment-inner dl{grid-template-columns:75px 1fr}}

.home-applicant-summary{min-width:0}

@media(max-width:650px){.home-applicant-names{font-size:10px}}
.pay-choices{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0}.pay-choices label{font-size:13px;font-weight:650;display:flex;gap:6px;align-items:center}.pay-choices input{accent-color:#527b65}.sms-request{display:inline-flex;align-items:center;gap:7px;margin:10px 0}.award-rules{margin-top:16px;background:#f1f8f3;border:1px solid #d1e6d8;border-radius:18px;padding:16px}.award-rules p{white-space:pre-line;font-size:13px;margin:8px 0}.run-entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 9px;border-bottom:1px solid #ffffff23;color:#e8f9ed;font-size:12px}.run-entry .run-round{color:#b8cbe3;font-size:11px}.run-entry.champion{border:1px solid #eab85d;background:#4d3c1e;border-radius:10px}.run-entry .run-score{color:#ffdb82;font-weight:900}.tour-stat.run.record-top{background:#62431c;color:#ffe49f;border:1px solid #e4ad42;box-shadow:0 0 0 1px #e4ad4260}.application-quickguide{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.modal-openonly .toolbar{display:none}

async function call(method,...args) {

  return new Promise((resolve,reject) => {
    const id = ++rpcSequence;
    const timer = setTimeout(() => {
      pendingRPC.delete(id);
      // Reconnect on the next request. Never replay a write automatically.
      bridgeConnection = null;
      reject(new Error('GAS 서버 응답 시간이 초과되었습니다. 저장 작업은 반영 여부를 확인한 후 다시 시도해 주세요.'));
    },30000);
    pendingRPC.set(id,{resolve,reject,timer});
    try {port.postMessage({visionBridge:'v2',nonce,kind:'call',id,method,args});}
    catch (error) {pendingRPC.delete(id);clearTimeout(timer);bridgeConnection=null;reject(error);}
  });
}

function fitVisibleTitles() {
  // Shrink toward a readable minimum. If still long, wrap only between words.
  const configs=[['brandTitle',19,12],['heroHeading',59,23]];
  configs.forEach(([id,max,min])=>{
    const el=$(id);
    if(!el)return;
    const host=el.parentElement;
    const available=id==='brandTitle' ? Math.max(90,host.clientWidth-(host.querySelector('.brandmark')?.offsetWidth||40)-(host.querySelector('#brandEdit')?.offsetWidth||0)-28) : Math.max(160,el.clientWidth);
    const lines=[...el.querySelectorAll('.title-line')];
    el.style.fontSize='';
    const desired=Math.min(max,Math.max(min,parseFloat(getComputedStyle(el).fontSize)||max));
    let size=desired;
    el.style.fontSize=size+'px';
    el.classList.remove('title-wrap');
    while(size>min && lines.some(line=>line.scrollWidth>available+2)) {
      size-=.5;
      el.style.fontSize=size+'px';
    }
    if(lines.some(line=>line.scrollWidth>available+2))el.classList.add('title-wrap');
  });
}

function propagateSimulationByes(rows){

 for(let slot=0;slot<16;slot++){
  const m=lookup(1,slot);if(!m)continue;
  const a=m.player1&&!String(m.player1).startsWith('BYE_');
  const b=m.player2&&!String(m.player2).startsWith('BYE_');

 }
 for(let round=2;round<=5;round++)for(let slot=0;slot<32/(2**round);slot++){
  const m=lookup(round,slot),a=lookup(round-1,slot*2),b=lookup(round-1,slot*2+1);
  if(!m||!a||!b)continue;
  m.player1=a.winner||'';m.player2=b.winner||'';
  const ac=sizes[(round-1)+':'+(slot*2)]||0,bc=sizes[(round-1)+':'+(slot*2+1)]||0;

function statisticsLocal(matches) {

function openSettings(keys){if(!token)return;const names=keys?.length?keys:Object.keys(FIELDS);modal('✏️ 대회 정보 수정',names.map(k=>{const [label,type]=FIELDS[k];return `<div class="field"><label for="f_${k}">${E(label)}</label>${type==='textarea'?`<textarea id="f_${k}" name="${k}">${E(val(k))}</textarea>`:type==='toggle'?`<select id="f_${k}" name="${k}"><option value="TRUE" ${val(k)==='TRUE'?'selected':''}>접수 중</option><option value="FALSE" ${val(k)==='FALSE'?'selected':''}>마감</option></select>`:`<input id="f_${k}" name="${k}" type="${type}" value="${E(val(k))}">`}</div>`}).join(''),async fd=>await run('saveSettings',token,Object.fromEntries(fd.entries())))}

function noticeEditor(id){const n=admin?.notices?.find(x=>x.id===id)||{};modal(id?'✏️ 공지 수정':'➕ 공지 등록',`<div class="field"><label>공지 제목</label><input name="title" required value="${E(n.title||'')}"></div><div class="field"><label>내용</label><textarea name="body">${E(n.body||'')}</textarea></div><div class="field"><label>노출 여부</label><select name="visible"><option value="TRUE" ${n.visible!=='FALSE'?'selected':''}>공개</option><option value="FALSE" ${n.visible==='FALSE'?'selected':''}>비공개</option></select></div>${id?'<button type="button" id="deleteEntry" class="btn sm danger">공지 삭제</button>':''}`,async fd=>await run('upsertNotice',token,{...Object.fromEntries(fd.entries()),id:id||''}));if(id)$('deleteEntry').onclick=()=>confirmDelete('정말 공지를 삭제하시겠습니까?',()=>run('removeNotice',token,id))}
function confirmDelete(question,action){modal('삭제 확인',`<p>${E(question)}</p>`,async()=>{await action()})}
function matchEditor(id){
 const m=db.matches.find(x=>x.id===id);
 if(!m)return;
 const a=E(displayName(m.player1)),b=E(displayName(m.player2));
 const fields=(i,name)=>'<div class="panel"><strong>'+name+'</strong><div class="field"><label>득점</label><input type="number" name="score'+i+'" min="0" value="'+E(m['score'+i]||'')+'"></div><div class="field"><label>이닝 수</label><input type="number" name="innings'+i+'" min="1" value="'+E(m['innings'+i]||'')+'"></div><div class="field"><label>최고 하이런</label><input type="number" name="highRun'+i+'" min="0" value="'+E(m['highRun'+i]||'')+'"></div></div>';
 const options=[m.player1,m.player2].filter(Boolean).map(pid=>'<option value="'+E(pid)+'" '+(m.winner===pid?'selected':'')+'>'+E(displayName(pid))+'</option>').join('');
 modal('✏️ 경기 결과 및 개인 기록','<div class="two">'+fields(1,a)+fields(2,b)+'</div><div class="field"><label>동일 경기 최고 하이런 선기록자 (동점인 경우 필수)</label><select name="highRunFirst"><option value="">동점이 아니거나 아직 확인되지 않음</option><option value="'+E(m.player1)+'" '+(m.highRunFirst===m.player1?'selected':'')+'>'+a+'</option><option value="'+E(m.player2)+'" '+(m.highRunFirst===m.player2?'selected':'')+'>'+b+'</option></select><small>최고 하이런 점수가 같다면 실제로 먼저 기록한 선수를 선택하세요.</small></div><div class="field"><label>승자</label><select name="winner" required><option value="">승자를 선택해 주세요</option>'+options+'</select></div>',async fd=>await run('saveMatch',token,id,fd.get('score1'),fd.get('score2'),fd.get('winner'),{innings1:fd.get('innings1'),innings2:fd.get('innings2'),highRun1:fd.get('highRun1'),highRun2:fd.get('highRun2'),highRunFirst:fd.get('highRunFirst')}));
}
function createBracket(){return askBracket('draw')}
function passwordEditor(){modal('관리자 비밀번호 변경',`<div class="field"><label>새 비밀번호 (8자 이상)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>`,async fd=>{await run('changePassword',token,fd.get('password'));token='';admin=null;})}
async function signout(){try{await call('logout',token)}catch(e){}token='';admin=null;nav('home');toast('로그아웃했습니다.')}
document.addEventListener('input',e=>{if(e.target.id==='pphone'||(e.target.name==='phone'&&e.target.closest('#modalForm'))){const el=e.target;const pos=el.selectionStart;el.value=phoneFormat(el.value);if(pos===el.value.length-1)el.setSelectionRange(el.value.length,el.value.length)}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();submitLogin(e);}else if(e.target.id==='applyForm'){e.preventDefault();submitRegistration(e);}});
window.addEventListener('resize',()=>requestAnimationFrame(fitVisibleTitles));
refresh().then(()=>{if(page==='admin'&&!token)focusFirstField('#loginForm');else if(page==='apply')focusFirstField('#applyForm')});
</script></div></body></html>
